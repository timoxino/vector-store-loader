services:
  pgvector:
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=sbdocs'
      - 'POSTGRES_PASSWORD=password'
      - 'POSTGRES_USER=admin'
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '5432:5432'
  mariadb:
    image: 'mariadb:11.7.2'
    environment:
      - 'MYSQL_ROOT_PASSWORD=rootpassword'
      - 'MYSQL_DATABASE=task'
      - 'MYSQL_USER=admin'
      - 'MYSQL_PASSWORD=password'
    ports:
      - '3306:3306'